[project]
name = "forge-doctor-data"
version = "0.7.0"
description = "Deterministic diagnostics for data engineering projects"
authors = [{ name = "Forge Doctor Data contributors" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["data-engineering", "diagnostics", "lint", "spark", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "packaging>=24",
]

[project.optional-dependencies]
watch = ["watchfiles>=0.21"]
lsp = ["pygls>=1.3", "lsprotocol>=2023.0.0"]
schemas = ["pyyaml>=6.0"]
sql = ["sqlglot>=26,<29"]

[project.urls]
Repository = "https://github.com/EdgarSocrates98/forge-doctor-data"
Changelog = "https://github.com/EdgarSocrates98/forge-doctor-data/blob/main/CHANGELOG.md"

[project.scripts]
forge-doctor-data = "forge_doctor_data.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.13",
    "sqlglot>=26,<29",
]

[tool.poetry]
packages = [{ include = "forge_doctor_data", from = "src" }]
include = [{ path = "src/forge_doctor_data/knowledge", format = ["sdist", "wheel"] }]
requires-poetry = ">=2.2"

[tool.forge-doctor-data]
exclude = [".pytest_tmp/**", "tests/sample_projects/**"]

# labs/** fixtures are intentionally misconfigured mini-projects used as
# detection ground truth; suppress their expected error findings so the
# dogfood CI job only fails on real regressions.
[[tool.forge-doctor-data.suppressions]]
rule = "RS004"
path = "labs/**"
reason = "lab fixture intentionally sets publicly_accessible/unencrypted cluster"
owner = "EdgarSocrates98"
approved_by = "EdgarSocrates98"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"

[tool.coverage.run]
source = ["src/forge_doctor_data"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100
extend-exclude = ["tests/sample_projects", "examples", "labs", "golden"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = ["RUF001"]  # severity icons (ℹ ⚠) are deliberate

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/forge_doctor_data/cli/**" = ["B006"]  # Typer list-valued options use [] defaults

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["forge_doctor_data"]
strict = true
warn_unreachable = true

# Optional extras must not pull their dependency trees into the type graph
# (e.g. pygls -> anyio -> trio -> _pytest -> numpy breaks py311 stubs).
[[tool.mypy.overrides]]
module = ["watchfiles", "pygls", "pygls.*", "lsprotocol", "lsprotocol.*", "yaml", "sqlglot", "sqlglot.*"]
follow_imports = "skip"
ignore_missing_imports = true

# pygls decorators are untyped upstream.
[[tool.mypy.overrides]]
module = ["forge_doctor_data.integrations.lsp_server"]
disallow_untyped_decorators = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
