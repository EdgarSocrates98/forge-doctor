[project]
name = "clean-python-project"
version = "0.1.0"
description = "Sample project that passes repository and python checks"
requires-python = ">=3.11"
dependencies = ["typer>=0.15"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
