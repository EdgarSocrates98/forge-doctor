name: release

# Manual only — publishing is a deliberate maintainer decision.
# Flow: tag vX.Y.Z → run this workflow → build → GitHub Release → PyPI.
#
# PyPI publishing uses Trusted Publishing (OIDC) — no long-lived API token.
# Maintainer setup (one-time, on pypi.org): project forge-doctor-data →
# Publishing → add workflow release.yml for repo EdgarSocrates98/forge-doctor-data.
# The pypi-publish action then mints a short-lived token and uploads PEP 740
# attestations linking artifacts to this workflow run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install and verify
        run: |
          poetry install --no-interaction
          poetry run pytest
          poetry build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    # Trusted Publishing (OIDC). Disabled until the PyPI project exists and
    # the maintainer enables it — flip `if: false` to enable.
    if: false
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
      attestations: write # PEP 740 artifact attestations
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing + attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
